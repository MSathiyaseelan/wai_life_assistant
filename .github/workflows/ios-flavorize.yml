name: iOS Flavor Setup

# One-off / on-demand: regenerates ios/Runner.xcodeproj's build configurations,
# schemes, and per-flavor GoogleService-Info.plist wiring from the `flavorizr:`
# block in pubspec.yaml, then commits the result back to the branch.
#
# Run this manually (Actions tab -> iOS Flavor Setup -> Run workflow) after
# changing the flavorizr config in pubspec.yaml or adding/removing a flavor.
# Not run automatically on every push, since flutter_flavorizr rewrites
# project.pbxproj and that should be a deliberate, reviewable step.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  flavorize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      # -p takes a comma-separated list of flutter_flavorizr "instructions",
      # not a platform name. This deliberately excludes flutter:app/pages/main
      # (which overwrite lib/ with flavorizr's own template app) and the
      # android:*/assets:download instructions (Android flavors are already
      # hand-configured and working) -- only the iOS Xcode project pieces run.
      - name: Generate iOS flavor configuration
        run: >
          dart run flutter_flavorizr -p
          ios:podfile,ios:xcconfig,ios:buildTargets,ios:schema,ios:plist,google:firebase

      - name: Commit generated project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          if git diff --cached --quiet; then
            echo "No changes produced by flavorizr."
          else
            git commit -m "Generate iOS flavor build configuration via flutter_flavorizr"
            git push
          fi
