<!doctype html>
<!--
  YouTube channel art, same look as feature-graphic.html (variant A).
    ?v=banner → 2048x1152 channel banner; everything important sits inside the
                1235x338 centre "safe area" shown on all devices.
    ?v=avatar → 800x800 profile picture (YouTube crops it to a circle).
  Render with chrome --headless --window-size=<w>,<h> --screenshot=... "youtube-channel-art.html?v=banner"
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; }
  body {
    font-family: 'Nunito', Arial, sans-serif;
    background: linear-gradient(120deg, #6A5CF6 0%, #5442E0 55%, #4330C4 100%);
    position: relative;
    color: #fff;
  }
  .orb { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.07); }
  .icon svg { width: 100%; height: 100%; display: block; }

  /* ── Banner ─────────────────────────────────────────── */
  body.banner { width: 2048px; height: 1152px; }
  body.banner .orb.one { width: 1000px; height: 1000px; right: -260px; top: -380px; }
  body.banner .orb.two { width: 620px; height: 620px; left: -200px; bottom: -300px; background: rgba(255,255,255,0.05); }
  .safe {
    position: absolute; left: 50%; top: 50%;
    width: 1235px; height: 338px; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; gap: 44px;
  }
  body.banner .icon {
    width: 230px; height: 230px; flex: none; border-radius: 52px;
    background: rgba(255,255,255,0.18); padding: 16px;
    box-shadow: 0 24px 60px rgba(20, 10, 90, 0.35);
  }
  .name-row { display: flex; align-items: center; gap: 18px; }
  .name { font-size: 86px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .ai {
    font-size: 32px; font-weight: 900; letter-spacing: 1px;
    padding: 8px 18px; border-radius: 16px;
    background: linear-gradient(135deg, #FFD36E, #FF9F5A);
    color: #3B1F7A; box-shadow: 0 8px 22px rgba(255, 170, 80, 0.35);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tagline { margin-top: 18px; font-size: 36px; font-weight: 700; opacity: 0.95; }
  .sub { margin-top: 10px; font-size: 25px; font-weight: 600; opacity: 0.75; }

  /* ── Avatar ─────────────────────────────────────────── */
  body.avatar { width: 800px; height: 800px; display: flex; align-items: center; justify-content: center; }
  body.avatar .orb.one { width: 600px; height: 600px; right: -220px; top: -260px; }
  body.avatar .icon { width: 460px; height: 460px; position: relative;
    filter: drop-shadow(0 24px 50px rgba(20, 10, 90, 0.4)); }
  body.avatar .safe, body.banner .solo { display: none; }
</style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="safe">
    <div class="icon" id="banner-icon"></div>
    <div class="text">
      <div class="name-row">
        <div class="name">RiyasHome</div>
        <div class="ai"><span>✦</span>AI</div>
      </div>
      <div class="tagline">Your family's life, organized.</div>
      <div class="sub">Just say it — your AI assistant does the rest.</div>
    </div>
  </div>

  <div class="icon solo" id="avatar-icon"></div>

  <script>
    const v = new URLSearchParams(location.search).get('v') === 'avatar' ? 'avatar' : 'banner';
    document.body.classList.add(v);
    const svg = `<svg viewBox="0 0 200 200">
      <rect width="200" height="200" rx="44" fill="#FAFAFC"/>
      <path d="M42,92 L98,40 Q100,38 102,40 L158,92" fill="none" stroke="#2B3A5C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="52" y1="86" x2="52" y2="106" stroke="#2B3A5C" stroke-width="13" stroke-linecap="round"/>
      <line x1="148" y1="86" x2="148" y2="106" stroke="#2B3A5C" stroke-width="13" stroke-linecap="round"/>
      <text x="100" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="112" fill="#2B3A5C" text-anchor="middle">R</text>
    </svg>`;
    document.getElementById('banner-icon').innerHTML = svg;
    document.getElementById('avatar-icon').innerHTML = svg;
  </script>
</body>
</html>
